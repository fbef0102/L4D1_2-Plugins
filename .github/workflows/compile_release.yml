name: Compile plugins and release

on:
  pull_request:
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
    branches:
      - master
  push:
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: build with sm${{ matrix.sm_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sm_version:
          - "1.12"
          # - "1.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "SCRIPTS_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "SPINCLUDE_PATH=$GITHUB_WORKSPACE/scripting_1.12/include" >> $GITHUB_ENV

      - name: Setup SourcePawn Compiler ${{ matrix.sm_version }}
        uses: rumblefrog/setup-sp@master
        with:
          version: ${{ matrix.sm_version }}

      - name: Compile plugins
        working-directory: ${{ env.SCRIPTS_PATH }}/
        run: |
          error_files=()
          for dir in */
          do
            dir=${dir%/}
            if [ -d "$dir" ]; then
              for file in $dir/scripting/*.sp
              do
                if [ -f "$file" ]; then
                  mkdir -p $dir/plugins
                  filename=$(basename "$file")
                  filename=${filename%.*}
                  echo -e "\nCompiling $file..."
                  spcomp -O2 -v2 -i "$dir/scripting/include" -i "$SPINCLUDE_PATH" -o "$dir/plugins/$filename.smx" $file || {
                    error_files+=("$filename")
                    continue
                  }
                fi
              done
            fi
          done
          if [ "${#error_files[*]}" -gt 0 ]; then
            echo -e "\n${#error_files[*]} plugin(s) failed to compile:"
            printf '  \n%s' "${error_files[*]}"
            exit 1
          else
            echo -e "\nAll plugins compiled successfully."
            exit 0
          fi

      - name: Remove all image folders
        run: |
          find . -type d -name "image" -exec rm -rf {} +  # 排除所有層級底下名為 image 的資料夾

      - name: Remove includes
        run: |
          rm -rf scripting_1.12 # 排除includes

      - name: Package
        uses: actions/upload-artifact@v4
        with:
          name: Harry-L4D1_2-Plugins-${{ matrix.sm_version }}
          path: |
            *

  release:
    name: Release
    needs: build
    if: always() && github.ref_name == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必須抓取完整的 Git 歷史紀錄才能讀取 Commit 記錄

      - name: Prepare env
        run: |
          echo "DATETIME=$(date +'%Y_%m_%d_%H%M')" >> $GITHUB_ENV
          
          # 取得自上一個 Tag 以來的 Commit 說明（Description / Body）
          # %b 代表 Commit 的詳細說明內文（若只想抓內文，可改用 %b；若連同標題一起抓可改用 "%s%n%b"）
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            # 如果找不到前一個標籤，抓最近 1 筆
            COMMIT_LOG=$(git log -n 1 --pretty=format:"%s%n%b" | sed '/^$/d')
          else
            # 如果有前一個標籤，抓兩者之間的 Commit
            COMMIT_LOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"%s%n%b" | sed '/^$/d')
          fi
          
          # 將抓到的 Commit 訊息寫入 GitHub Environment 中（支援多行）
          # 參考 GitHub Actions 官方的文件寫法
          delimiter="EOF_$RANDOM"
          echo "RELEASE_NOTES<<$delimiter" >> $GITHUB_ENV
          echo "$COMMIT_LOG" >> $GITHUB_ENV
          echo "$delimiter" >> $GITHUB_ENV

      - name: Prepare env
        run: |
          echo "DATETIME=$(date +'%Y_%m_%d_%H%M')" >> $GITHUB_ENV
          
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: tmp/ # 虛擬機會在這裡自動建立名為 tmp 的資料夾，並把編譯好的檔案放進去

      - name: Zip Artifacts
        working-directory: tmp/
        run: |
          # https://unix.stackexchange.com/questions/68489/command-to-zip-multiple-directories-into-individual-zip-files
          for i in */; do zip -0 -r "${i%/}.zip" "$i" & done; wait
  
      - name: Create Release and Auto Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.DATETIME }}"
          name: "${{ env.DATETIME }}_update"
          # 直接帶入我們剛剛過濾好的純 Commit 訊息
          body: ${{ env.RELEASE_NOTES }}
          files: |
            tmp/Harry-L4D1_2-Plugins-*.zip
